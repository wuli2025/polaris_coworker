# Polaris 服务器一键上云。用法：
#   cp .env.server.example .env   # 填 token/key
#   docker compose up -d                     # 生产主路径:polaris-web，由 HTTPS 反代接入
#
# ── 服务角色 ──
# · polaris-web  账号/邀请票据/白名单/审计 + Web 面板(8080) + 中继协调   [常驻]
# · relay        iroh-relay 实验组件（当前客户端流程尚未接通）          [--profile relay]
# · gitea        无头 Gitea:git 仓库存储                               [--profile gitea, 默认不起]
#
# ⚠ Gitea 只在「这台机也要当权威仓库存储」时才需要(整栈上云)。
#   纯中继模型下仓库存在你的主机(电脑/NAS),云机不存项目 → 不要 gitea profile。
#   自签证书见 docker/relay/gen-cert.sh。

services:
  polaris:
    # 预构建镜像优先(R2 一键安装脚本 docker load 后直接 up,无需源码);
    # 本地有源码想自建时 docker compose up -d --build 走下面的 build。
    image: polaris-server:${POLARIS_IMAGE_TAG:-latest}
    build: .
    container_name: polaris-web
    restart: unless-stopped
    # 安全默认：只给本机 TLS 反代访问，不把带 owner 能力的明文 HTTP 直接暴露公网。
    # 仅在可信内网且明确接受明文风险时，才在 .env 设置 POLARIS_BIND_IP=0.0.0.0。
    ports:
      - "${POLARIS_BIND_IP:-127.0.0.1}:8080:8080"
      # iroh 打洞用的 UDP 口。**必须发布**,而且必须是固定口:iroh 默认随机绑,
      # 容器里随机口等于外面永远打不进来 → 打洞必失败 → 全部流量绕公共中继,
      # 实测往返从 12ms 变 370ms、盘慢 30 倍,而且不报任何错(只是"能用但很慢")。
      # 与 .env 的 POLARIS_IROH_PORT 必须同值;云防火墙/安全组也要放行这个 UDP 口。
      - "${POLARIS_IROH_PORT:-41641}:${POLARIS_IROH_PORT:-41641}/udp"
    environment:
      # 留空（默认）= 免口令，谁连上谁能用：家用 NAS 在 NAT 后面公网连不上，
      # 而口令忘了没有找回入口。只有真做了公网映射/反代域名才在 .env 里填上它。
      - POLARIS_AUTH_TOKEN=${POLARIS_AUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - POLARIS_REPO_ROOT=${POLARIS_REPO_ROOT:-/home/polaris/Polaris/repos}
      # 协作:/git/* 反代与 Gitea REST 指向 gitea 容器(仅在 --profile gitea 启用时用到;
      # 纯中继下 gitea 不起,polaris-web 只在有人真正用 git 功能时才惰性访问,不硬依赖)
      - POLARIS_GITEA_HOST=gitea
      - POLARIS_GITEA_PORT=3000
      # ── 小内存服务器(2G/2核)适配 ──
      # server feature 的 SQLite 预算默认按大内存机给(每连接 mmap 2GiB + cache 64MiB),
      # 2G 小机必炸;这里压到 mmap 64MiB / cache 8MiB / 2 worker。大内存机器想吃满吞吐
      # 在 .env 里调大(POLARIS_FABLE_MMAP_MB=2048 等)即可。
      - POLARIS_FABLE_WORKERS=${POLARIS_FABLE_WORKERS:-2}
      - POLARIS_FABLE_MMAP_MB=${POLARIS_FABLE_MMAP_MB:-64}
      - POLARIS_FABLE_CACHE_MB=${POLARIS_FABLE_CACHE_MB:-8}
      # ── 邮箱服务(注册验证码/找回密码)。env 优先;留空则用 owner 在
      #    Web「邮箱服务设置」面板存的配置。QQ 邮箱 PASS=SMTP 授权码(不是 QQ 密码)。
      - POLARIS_SMTP_HOST=${POLARIS_SMTP_HOST:-}
      - POLARIS_SMTP_PORT=${POLARIS_SMTP_PORT:-}
      - POLARIS_SMTP_USER=${POLARIS_SMTP_USER:-}
      - POLARIS_SMTP_PASS=${POLARIS_SMTP_PASS:-}
      - POLARIS_SMTP_FROM=${POLARIS_SMTP_FROM:-}
      - POLARIS_EMAIL_SIGNUP=${POLARIS_EMAIL_SIGNUP:-}
      # 账号权威:云机设 POLARIS_ACCOUNT_AUTHORITY=1 即成为「账号中心」,
      # 其余主机填 POLARIS_ACCOUNT_AUTHORITY_URL 指向它。两个都不设 = 老的本机账号行为。
      # 签名私钥落 /home/polaris/Polaris/data/account_authority.key(在 polaris-data 卷里,
      # 随卷备份即可;丢了所有成员主机都要重新信任)。
      - POLARIS_ACCOUNT_AUTHORITY=${POLARIS_ACCOUNT_AUTHORITY:-}
      - POLARIS_ACCOUNT_AUTHORITY_URL=${POLARIS_ACCOUNT_AUTHORITY_URL:-}
      # ── 互联(iroh 隧道 / 远程盘)──
      # 固定 UDP 口:要与上面 ports 里发布的那个一致(理由见 ports 处注释)。
      - POLARIS_IROH_PORT=${POLARIS_IROH_PORT:-41641}
      # 自建/指定中继,逗号分隔。打洞成功时用不上它,但打洞失败时它是唯一的兜底 ——
      # 不设就会落到 n0 的公共中继(可能在欧洲,每跳往返几百毫秒)。
      - POLARIS_RELAYS=${POLARIS_RELAYS:-}
      # 主机隧道开机自启。不设的话每次容器重建都得手动 POST 一次 /api/collab/tunnel/start,
      # 否则对端只会一直等不到应答(现象是"盘挂不上",完全看不出是少了一条启动指令)。
      - POLARIS_TUNNEL_AUTOSTART=${POLARIS_TUNNEL_AUTOSTART:-1}
      # 隧道性能旋钮(留空=按机器自适应):worker 数默认取 CPU 核数,
      # 转发缓冲默认 256KB,远程盘传输压缩级别默认 3(设 0 关闭压缩)。
      - POLARIS_TUNNEL_WORKERS=${POLARIS_TUNNEL_WORKERS:-}
      - POLARIS_TUNNEL_BUF_KB=${POLARIS_TUNNEL_BUF_KB:-}
      - POLARIS_FS_ZSTD_LEVEL=${POLARIS_FS_ZSTD_LEVEL:-}
    volumes:
      - polaris-data:/home/polaris/Polaris   # 数据根：知识库/collab.db(data/) 等
      - polaris-claude:/home/polaris/.claude # claude 凭证与 settings.json
    # 2G 整机预算(纯中继:无 gitea):polaris 1.6G + relay 128M,留 ~300M 给内核/系统。
    # 若开 --profile gitea(整栈),把 POLARIS_MEM_LIMIT 调回 1250m 给 gitea 让 384M。
    # docker compose v2 在非 swarm 下同样吃 deploy.resources.limits。
    deploy:
      resources:
        limits:
          memory: ${POLARIS_MEM_LIMIT:-1600m}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # 无头 Gitea：git 仓库存储（仅供 Polaris 容器内部访问），不对外发布端口。
  # 默认不起——纯中继模型下仓库存主机,云机不需要。整栈上云才 --profile gitea。
  gitea:
    profiles: ["gitea"]
    image: gitea/gitea:1.22
    container_name: polaris-gitea
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__server__HTTP_ADDR=0.0.0.0
      - GITEA__server__ROOT_URL=http://gitea:3000/
      # 管理员账号在 DEPLOY-CLOUD.md「初始化 Gitea」一步用 gitea admin 命令创建
    volumes:
      - gitea-data:/data
    deploy:
      resources:
        limits:
          memory: ${GITEA_MEM_LIMIT:-384m}

  # 可选：iroh-relay 中继（profile: relay）。先跑 docker/relay/gen-cert.sh <公网IP>
  # 生成自签证书，再 --profile relay 启动。
  relay:
    profiles: ["relay"]
    # n0computer/iroh-relay 官方镜像（Docker Hub）。若你的环境拉不到该镜像，
    # 注释掉 image 行，改用源码构建占位：
    #   build: https://github.com/n0-computer/iroh.git#main:iroh-relay
    # 或在服务器上 cargo install iroh-relay 后自行打镜像。
    image: n0computer/iroh-relay:latest
    container_name: polaris-relay
    restart: unless-stopped
    command: ["--config-path", "/config/config.toml"]
    # v7 定案:对外只开 443 TCP(中继转发) + 443 UDP(QUIC 中继+地址发现)。
    # STUN(3478) 不开——QUIC 地址发现已替代;80 也不开——手动自签证书用不上 ACME。
    ports:
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./docker/relay:/config:ro   # config.toml + certs/（gen-cert.sh 产物）
    deploy:
      resources:
        limits:
          memory: ${RELAY_MEM_LIMIT:-128m}

volumes:
  polaris-data:
  polaris-claude:
  gitea-data:
