name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and publish (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read application version
        id: app
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ steps.app.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.app.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Polaris
            org.opencontainers.image.description=Polaris collaboration server and Web application
            org.opencontainers.image.revision=${{ github.sha }}
            io.polaris.app.version=${{ steps.app.outputs.version }}

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            POLARIS_BUILD_REVISION=${{ github.sha }}
            POLARIS_BUILD_VERSION=${{ steps.app.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Validate Docker click-update path with real Watchtower
        shell: bash
        env:
          POLARIS_E2E: "1"
          BASE_IMAGE: ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          sh -n docker/update.sh
          sh -n docker/test-update-e2e.sh
          sh docker/test-update-e2e.sh
